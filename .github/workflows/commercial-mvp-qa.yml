name: Commercial MVP QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/commercial-mvp-qa.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Next build
        run: npm run build

      - name: Smoke itineraries
        run: npm run smoke:itineraries

      - name: Smoke calculator
        run: npm run smoke:calculadora

      - name: Smoke titles
        run: npm run smoke:titles

      - name: Smoke sitemap
        run: npm run smoke:sitemap
