name: Verify public static rendering

on:
  push:
    branches:
      - perf/static-public-routes

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXkudGVzdA==
          CLERK_SECRET_KEY: sk_test_dummy
        run: npm run build
