name: SEO smoke validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'next.config.mjs'
      - 'public/robots.txt'
      - 'src/app/sitemap.ts'
      - 'src/app/[locale]/page.tsx'
      - 'src/app/[locale]/blog/**'
      - 'src/app/[locale]/actividades/**'
      - 'src/app/[locale]/free-tours-lisboa/**'
      - 'src/app/[locale]/itinerarios/**'
      - 'src/components/**'
      - 'src/lib/editorial-photo-policy.ts'
      - 'src/app/globals.css'
      - 'scripts/smoke-grok-rendered.mjs'
      - 'src/data/blog-posts.ts'
      - 'src/data/activities.ts'
      - 'src/data/guide-packs.ts'
      - 'scripts/smoke-sitemap.mjs'
      - 'scripts/smoke-grok-redesign.mjs'
      - 'src/components/home/GrokHome.tsx'
      - 'src/app/grok-redesign.css'
      - '.github/workflows/seo-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'next.config.mjs'
      - 'public/robots.txt'
      - 'src/app/sitemap.ts'
      - 'src/app/[locale]/page.tsx'
      - 'src/app/[locale]/blog/**'
      - 'src/app/[locale]/actividades/**'
      - 'src/app/[locale]/free-tours-lisboa/**'
      - 'src/app/[locale]/itinerarios/**'
      - 'src/components/**'
      - 'src/lib/editorial-photo-policy.ts'
      - 'src/app/globals.css'
      - 'scripts/smoke-grok-rendered.mjs'
      - 'src/data/blog-posts.ts'
      - 'src/data/activities.ts'
      - 'src/data/guide-packs.ts'
      - 'scripts/smoke-sitemap.mjs'
      - 'scripts/smoke-grok-redesign.mjs'
      - 'src/components/home/GrokHome.tsx'
      - 'src/app/grok-redesign.css'
      - '.github/workflows/seo-smoke.yml'

permissions:
  contents: read

concurrency:
  group: seo-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and validate SEO surface
        run: npm run smoke:sitemap

      - name: Verify latest articles in Home and blog
        run: npm run test:blog-chronology

      - name: Guard design, links and photos of Grok redesign
        run: npm run smoke:grok-redesign

      - name: Check rendered routes, photos and retained itinerary
        env:
          SMOKE_BASE_URL: http://localhost:3440
        run: |
          npm run start -- --hostname localhost --port 3440 > /tmp/grok-next.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:3440/sitemap.xml > /dev/null && break
            sleep 1
          done
          npm run smoke:grok-rendered
